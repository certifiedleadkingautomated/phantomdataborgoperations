<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Processor</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- sql.js WebAssembly -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
    <!-- PapaParse for CSV processing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-8 flex flex-col items-center justify-center">

    <div class="w-full max-w-4xl space-y-4">
        
        <!-- Detected & Locked Source Badge -->
        <div id="sourceBadge" class="hidden flex items-center justify-between px-4 py-3 bg-slate-800 border border-slate-700 rounded-xl shadow-lg">
            <div class="flex items-center space-x-3">
                <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                </svg>
                <span class="text-xs text-slate-400">Grid Locked To Source:</span>
                <span id="sourceName" class="text-xs font-bold px-2.5 py-1 rounded-md bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 uppercase tracking-wider">
                    Unknown
                </span>
            </div>
            <button onclick="resetGrid()" class="text-xs text-slate-400 hover:text-red-400 transition-colors">
                Clear All Files & Unlock
            </button>
        </div>

        <!-- Drop Zone Container -->
        <div id="dropZone" 
             class="relative border-2 border-dashed border-slate-700 bg-slate-800/50 hover:bg-slate-800 hover:border-slate-500 transition-all rounded-2xl p-6 min-h-[180px] flex flex-col items-center justify-center cursor-pointer group">
            
            <input type="file" id="fileInput" accept=".csv" multiple class="hidden">

            <div id="placeholder" class="text-center space-y-2 pointer-events-none">
                <svg class="w-10 h-10 mx-auto text-slate-500 group-hover:text-slate-400 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
                </svg>
                <p class="text-sm font-medium text-slate-300">Drop CSV files here or <span class="text-indigo-400 underline">browse</span></p>
                <p class="text-xs text-slate-500">First file will lock the grid to Phantom source format</p>
            </div>

            <div id="fileGrid" class="w-full grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3 hidden">
                <button id="addMoreBtn" type="button" class="flex flex-col items-center justify-center h-24 rounded-xl border border-dashed border-slate-600 hover:border-indigo-400 hover:bg-indigo-500/10 text-slate-400 hover:text-indigo-300 transition-all">
                    <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                    </svg>
                    <span class="text-xs font-medium">Add Files</span>
                </button>
            </div>
        </div>

        <!-- Action Panel -->
        <div id="actionPanel" class="hidden flex items-center justify-between p-4 bg-slate-800 border border-slate-700 rounded-xl">
            <span id="recordStatus" class="text-xs text-slate-400">Ready to process files...</span>
            <button id="processBtn" onclick="processPhantomFiles()" class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-medium text-xs rounded-lg transition-all shadow-lg flex items-center space-x-2">
                <span>⚡ Unpivot & Deduplicate Phantom Files</span>
            </button>
        </div>

        <!-- Error Alert Banner -->
        <div id="errorBanner" class="hidden p-3 bg-red-500/10 border border-red-500/30 rounded-xl text-red-400 text-xs flex items-center justify-between">
            <span id="errorMessage">Invalid file format.</span>
            <button onclick="hideError()" class="text-red-400 hover:text-white ml-2 font-bold">✕</button>
        </div>

    </div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const placeholder = document.getElementById('placeholder');
        const fileGrid = document.getElementById('fileGrid');
        const addMoreBtn = document.getElementById('addMoreBtn');
        const sourceBadge = document.getElementById('sourceBadge');
        const sourceName = document.getElementById('sourceName');
        const actionPanel = document.getElementById('actionPanel');
        const recordStatus = document.getElementById('recordStatus');
        const errorBanner = document.getElementById('errorBanner');
        const errorMessage = document.getElementById('errorMessage');

        let loadedFiles = [];
        let lockedSource = null;
        let db = null;

        // Initialize SQLite WebAssembly Instance
        initSqlJs({ locateFile: filename => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/${filename}` })
            .then(SQL => { db = new SQL.Database(); })
            .catch(err => showError("Failed to initialize SQLite Wasm: " + err.message));

        dropZone.addEventListener('click', (e) => {
            if (e.target !== addMoreBtn && !addMoreBtn.contains(e.target)) {
                if (loadedFiles.length === 0) fileInput.click();
            }
        });

        addMoreBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            fileInput.click();
        });

        ['dragenter', 'dragover'].forEach(name => {
            dropZone.addEventListener(name, (e) => {
                e.preventDefault();
                dropZone.classList.add('border-indigo-500', 'bg-slate-800');
            });
        });

        ['dragleave', 'drop'].forEach(name => {
            dropZone.addEventListener(name, (e) => {
                e.preventDefault();
                dropZone.classList.remove('border-indigo-500', 'bg-slate-800');
            });
        });

        dropZone.addEventListener('drop', (e) => {
            const files = Array.from(e.dataTransfer.files).filter(f => f.name.endsWith('.csv'));
            processFiles(files);
        });

        fileInput.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            processFiles(files);
            fileInput.value = '';
        });

        async function processFiles(files) {
            hideError();

            for (const file of files) {
                if (loadedFiles.some(f => f.file.name === file.name && f.file.size === file.size)) continue;

                const headers = await getCsvHeaders(file);
                const detectedSource = identifySource(headers);

                if (!detectedSource) {
                    showError(`Could not identify source for "${file.name}". Missing "best_mobile" column.`);
                    continue;
                }

                if (lockedSource === null) {
                    lockedSource = detectedSource;
                } else if (lockedSource !== detectedSource) {
                    showError(`Grid locked to ${lockedSource}. Cannot add "${file.name}".`);
                    continue;
                }

                loadedFiles.push({ file, source: detectedSource, headers });
            }

            renderGrid();
        }

        function getCsvHeaders(file) {
            return new Promise((resolve) => {
                Papa.parse(file, {
                    preview: 1,
                    header: true,
                    complete: (results) => resolve(results.meta.fields || []),
                    error: () => resolve([])
                });
            });
        }

        function identifySource(headers) {
            const clean = headers.map(h => h.trim().toLowerCase());
            return clean.includes('best_mobile') ? 'Phantom' : null;
        }

        function renderGrid() {
            if (loadedFiles.length === 0) {
                lockedSource = null;
                placeholder.classList.remove('hidden');
                fileGrid.classList.add('hidden');
                sourceBadge.classList.add('hidden');
                actionPanel.classList.add('hidden');
                return;
            }

            placeholder.classList.add('hidden');
            fileGrid.classList.remove('hidden');
            sourceBadge.classList.remove('hidden');
            actionPanel.classList.remove('hidden');
            sourceName.textContent = lockedSource;
            recordStatus.textContent = `${loadedFiles.length} file(s) ready for processing.`;

            const cards = fileGrid.querySelectorAll('.file-card');
            cards.forEach(card => card.remove());

            loadedFiles.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = "file-card relative group/card flex flex-col items-center justify-center p-3 h-24 bg-slate-800 border border-slate-700 rounded-xl hover:border-slate-500 transition-all text-center";
                card.innerHTML = `
                    <button onclick="removeFile(${index}, event)" class="absolute -top-1.5 -right-1.5 bg-slate-700 hover:bg-red-500 text-slate-300 hover:text-white rounded-full p-1 opacity-0 group-hover/card:opacity-100 transition-opacity shadow-lg">
                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                    </button>
                    <svg class="w-6 h-6 text-indigo-400 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                    <p class="text-xs font-medium text-slate-200 truncate w-full px-1" title="${item.file.name}">${item.file.name}</p>
                    <span class="text-[10px] text-slate-400 mt-0.5">${(item.file.size / 1024).toFixed(1)} KB</span>
                `;
                fileGrid.insertBefore(card, addMoreBtn);
            });
        }

        // Execute Phantom Unpivot, Merge, Deduplicate, and Export
        async function processPhantomFiles() {
            if (!db || loadedFiles.length === 0) return;

            try {
                recordStatus.textContent = "Processing files in SQLite Wasm...";

                // Reset Database Tables
                db.run("DROP TABLE IF EXISTS master_phantom;");
                
                const unionQueries = [];

                // 1. Load each CSV file into its own raw SQLite table
                for (let i = 0; i < loadedFiles.length; i++) {
                    const tableName = `raw_phantom_${i + 1}`;
                    db.run(`DROP TABLE IF EXISTS ${tableName};`);

                    const parsedData = await parseCsvFile(loadedFiles[i].file);
                    if (!parsedData.length) continue;

                    // Ensure key columns exist with safe fallback
                    const columnsSchema = ["first_name", "last_name", "best_mobile", "best_mobile_2", "email", "street_address", "city", "state", "zip"]
                        .map(c => `"${c}" TEXT`).join(", ");
                    
                    db.run(`CREATE TABLE ${tableName} (${columnsSchema});`);

                    const insertSql = `INSERT INTO ${tableName} (first_name, last_name, best_mobile, best_mobile_2, email, street_address, city, state, zip) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?);`;
                    
                    db.run("BEGIN TRANSACTION;");
                    parsedData.forEach(row => {
                        db.run(insertSql, [
                            row.first_name || null,
                            row.last_name || null,
                            row.best_mobile || null,
                            row.best_mobile_2 || null,
                            row.email || null,
                            row.street_address || null,
                            row.city || null,
                            row.state || null,
                            row.zip || null
                        ]);
                    });
                    db.run("COMMIT;");

                    // Build UNION query parts for best_mobile AND best_mobile_2 (renamed to best_mobile)
                    unionQueries.push(`
                        SELECT first_name, last_name, best_mobile, email, street_address, city, state, zip FROM ${tableName} WHERE best_mobile IS NOT NULL AND TRIM(best_mobile) != ''
                        UNION ALL
                        SELECT first_name, last_name, best_mobile_2 AS best_mobile, email, street_address, city, state, zip FROM ${tableName} WHERE best_mobile_2 IS NOT NULL AND TRIM(best_mobile_2) != ''
                    `);
                }

                if (!unionQueries.length) {
                    showError("No valid rows found in uploaded files.");
                    return;
                }

                // 2. Run consolidated query to create deduplicated master table
                const finalMasterSql = `
                    CREATE TABLE master_phantom AS
                    WITH combined_sources AS (
                        ${unionQueries.join(" UNION ALL ")}
                    )
                    SELECT first_name, last_name, best_mobile, email, street_address, city, state, zip
                    FROM combined_sources
                    GROUP BY best_mobile;
                `;

                db.run(finalMasterSql);

                // 3. Extract final master dataset from SQLite
                const result = db.exec("SELECT first_name, last_name, best_mobile, email, street_address, city, state, zip FROM master_phantom;");
                
                if (result.length === 0 || !result[0].values.length) {
                    showError("Resulting master table is empty.");
                    return;
                }

                // Format records back to object array for PapaParse CSV Export
                const columns = result[0].columns;
                const rows = result[0].values.map(val => {
                    const obj = {};
                    columns.forEach((col, idx) => { obj[col] = val[idx]; });
                    return obj;
                });

                recordStatus.textContent = `Completed! ${rows.length} unique contact records generated.`;

                // 4. Trigger Automatic CSV Download
                downloadCsv(rows, `phantom_master_deduplicated_${Date.now()}.csv`);

            } catch (err) {
                console.error(err);
                showError("Processing Error: " + err.message);
            }
        }

        function parseCsvFile(file) {
            return new Promise((resolve) => {
                Papa.parse(file, {
                    header: true,
                    skipEmptyLines: true,
                    complete: (results) => resolve(results.data || []),
                    error: () => resolve([])
                });
            });
        }

        function downloadCsv(data, filename) {
            const csvText = Papa.unparse(data);
            const blob = new Blob([csvText], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            
            const link = document.createElement("a");
            link.href = url;
            link.setAttribute("download", filename);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function removeFile(index, event) {
            event.stopPropagation();
            loadedFiles.splice(index, 1);
            renderGrid();
        }

        function resetGrid() {
            loadedFiles = [];
            hideError();
            renderGrid();
        }

        function showError(msg) {
            errorMessage.textContent = msg;
            errorBanner.classList.remove('hidden');
        }

        function hideError() {
            errorBanner.classList.add('hidden');
        }
    </script>
</body>
</html>
