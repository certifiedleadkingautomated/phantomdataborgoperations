<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SQLite Engine Test</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- sql.js WebAssembly build for client-side SQLite -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center p-6 text-center">

    <div class="max-w-md bg-slate-800 p-8 rounded-2xl border border-slate-700 shadow-xl">
        <h1 class="text-2xl font-bold mb-4 tracking-tight">🗄️ SQLite Connection Test</h1>
        
        <!-- Status Indicator Box -->
        <div id="dbStatus" class="inline-block px-4 py-2 bg-amber-500/20 text-amber-400 font-mono text-sm rounded-lg border border-amber-500/30 animate-pulse">
            Status: Initializing SQLite WASM Engine...
        </div>
    </div>

    <script>
        // Tell sql.js where to fetch the sql-wasm.wasm binary file
        const wasmConfig = { 
            locateFile: filename => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/${filename}` 
        };

        // Initialize the SQLite WebAssembly Instance
        initSqlJs(wasmConfig).then(SQL => {
            // Create an in-memory database instance
            const db = new SQL.Database();
            
            // Connection successful—update the UI status
            const statusBox = document.getElementById('dbStatus');
            statusBox.className = "inline-block px-4 py-2 bg-green-500/20 text-green-400 font-mono text-sm rounded-lg border border-green-500/30";
            statusBox.innerText = "Status: SQLite Engine Connected Successfully!";
        }).catch(error => {
            // Catch failed connection or CDN blocking errors
            const statusBox = document.getElementById('dbStatus');
            statusBox.className = "inline-block px-4 py-2 bg-red-500/20 text-red-400 font-mono text-sm rounded-lg border border-red-500/30";
            statusBox.innerText = "Status: Connection Failed";
            console.error("SQLite Initialization Error:", error);
        });
    </script>
</body>
</html>
