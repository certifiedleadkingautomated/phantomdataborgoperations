<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Processor</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- sql.js WebAssembly -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
    <!-- PapaParse for parsing CSVs -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-8 flex flex-col items-center justify-center">

    <div class="w-full max-w-4xl space-y-4">
        
        <!-- Detected & Locked Source Badge -->
        <div id="sourceBadge" class="hidden flex items-center justify-between px-4 py-3 bg-slate-800 border border-slate-700 rounded-xl shadow-lg">
            <div class="flex items-center space-x-3">
                <!-- Lock Icon -->
                <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                </svg>
                <span class="text-xs text-slate-400">Grid Locked To Source:</span>
                <span id="sourceName" class="text-xs font-bold px-2.5 py-1 rounded-md bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 uppercase tracking-wider">
                    Unknown
                </span>
            </div>
            <button onclick="resetGrid()" class="text-xs text-slate-400 hover:text-red-400 transition-colors">
                Clear All Files & Unlock
            </button>
        </div>

        <!-- Drop Zone Container -->
        <div id="dropZone" 
             class="relative border-2 border-dashed border-slate-700 bg-slate-800/50 hover:bg-slate-800 hover:border-slate-500 transition-all rounded-2xl p-6 min-h-[180px] flex flex-col items-center justify-center cursor-pointer group">
            
            <!-- Hidden File Input -->
            <input type="file" id="fileInput" accept=".csv" multiple class="hidden">

            <!-- Initial Placeholder Text -->
            <div id="placeholder" class="text-center space-y-2 pointer-events-none">
                <svg class="w-10 h-10 mx-auto text-slate-500 group-hover:text-slate-400 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
                </svg>
                <p class="text-sm font-medium text-slate-300">Drop CSV files here or <span class="text-indigo-400 underline">browse</span></p>
                <p class="text-xs text-slate-500">First file will lock the grid to its source format</p>
            </div>

            <!-- Stacked File Grid -->
            <div id="fileGrid" class="w-full grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3 hidden">
                <!-- Add More Button Card -->
                <button id="addMoreBtn" type="button" class="flex flex-col items-center justify-center h-24 rounded-xl border border-dashed border-slate-600 hover:border-indigo-400 hover:bg-indigo-500/10 text-slate-400 hover:text-indigo-300 transition-all">
                    <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                    </svg>
                    <span class="text-xs font-medium">Add Files</span>
                </button>
            </div>
        </div>

        <!-- Error Alert Banner -->
        <div id="errorBanner" class="hidden p-3 bg-red-500/10 border border-red-500/30 rounded-xl text-red-400 text-xs flex items-center justify-between">
            <span id="errorMessage">Invalid file format.</span>
            <button onclick="hideError()" class="text-red-400 hover:text-white ml-2 font-bold">✕</button>
        </div>

    </div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const placeholder = document.getElementById('placeholder');
        const fileGrid = document.getElementById('fileGrid');
        const addMoreBtn = document.getElementById('addMoreBtn');
        const sourceBadge = document.getElementById('sourceBadge');
        const sourceName = document.getElementById('sourceName');
        const errorBanner = document.getElementById('errorBanner');
        const errorMessage = document.getElementById('errorMessage');

        let loadedFiles = [];
        let lockedSource = null; // Stores 'Phantom', 'Go High Level', 'Databorg', or null

        // Trigger file browser
        dropZone.addEventListener('click', (e) => {
            if (e.target !== addMoreBtn && !addMoreBtn.contains(e.target)) {
                if (loadedFiles.length === 0) fileInput.click();
            }
        });

        addMoreBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            fileInput.click();
        });

        // Drag and drop handlers
        ['dragenter', 'dragover'].forEach(name => {
            dropZone.addEventListener(name, (e) => {
                e.preventDefault();
                e.stopPropagation();
                dropZone.classList.add('border-indigo-500', 'bg-slate-800');
            });
        });

        ['dragleave', 'drop'].forEach(name => {
            dropZone.addEventListener(name, (e) => {
                e.preventDefault();
                e.stopPropagation();
                dropZone.classList.remove('border-indigo-500', 'bg-slate-800');
            });
        });

        dropZone.addEventListener('drop', (e) => {
            const files = Array.from(e.dataTransfer.files).filter(f => f.name.endsWith('.csv'));
            processFiles(files);
        });

        fileInput.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            processFiles(files);
            fileInput.value = '';
        });

        // Read and classify uploaded CSVs
        async function processFiles(files) {
            hideError();

            for (const file of files) {
                // Ignore exact duplicate files
                if (loadedFiles.some(f => f.file.name === file.name && f.file.size === file.size)) {
                    continue;
                }

                const headers = await getCsvHeaders(file);
                const detectedSource = identifySource(headers);

                if (!detectedSource) {
                    showError(`Could not identify source for "${file.name}". Unrecognized column headers.`);
                    continue;
                }

                // If grid is unlocked, lock it to the first file's source
                if (lockedSource === null) {
                    lockedSource = detectedSource;
                } 
                // Reject files that do not match the locked source
                else if (lockedSource !== detectedSource) {
                    showError(`Grid locked to ${lockedSource}. Cannot add "${file.name}" because it is from ${detectedSource}.`);
                    continue;
                }

                loadedFiles.push({ file, source: detectedSource, headers });
            }

            renderGrid();
        }

        // Parse first row of CSV to extract headers
        function getCsvHeaders(file) {
            return new Promise((resolve) => {
                Papa.parse(file, {
                    preview: 1,
                    header: true,
                    complete: (results) => resolve(results.meta.fields || []),
                    error: () => resolve([])
                });
            });
        }

        // Identify source by matching expected unique column names
        function identifySource(headers) {
            const clean = headers.map(h => h.trim().toLowerCase());

            if (clean.includes('best_mobile')) {
                return 'Phantom';
            }
            if (clean.includes('contact_id') || clean.includes('phone_number')) {
                return 'Go High Level';
            }
            if (clean.includes('databorg_id') || clean.includes('company_domain')) {
                return 'Databorg';
            }

            return null;
        }

        function renderGrid() {
            if (loadedFiles.length === 0) {
                lockedSource = null; // Unlock grid when empty
                placeholder.classList.remove('hidden');
                fileGrid.classList.add('hidden');
                sourceBadge.classList.add('hidden');
                return;
            }

            placeholder.classList.add('hidden');
            fileGrid.classList.remove('hidden');
            sourceBadge.classList.remove('hidden');
            sourceName.textContent = lockedSource;

            // Clear cards except 'Add More' button
            const cards = fileGrid.querySelectorAll('.file-card');
            cards.forEach(card => card.remove());

            loadedFiles.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = "file-card relative group/card flex flex-col items-center justify-center p-3 h-24 bg-slate-800 border border-slate-700 rounded-xl hover:border-slate-500 transition-all text-center";
                
                card.innerHTML = `
                    <button onclick="removeFile(${index}, event)" class="absolute -top-1.5 -right-1.5 bg-slate-700 hover:bg-red-500 text-slate-300 hover:text-white rounded-full p-1 opacity-0 group-hover/card:opacity-100 transition-opacity shadow-lg">
                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                        </svg>
                    </button>
                    <svg class="w-6 h-6 text-indigo-400 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                    </svg>
                    <p class="text-xs font-medium text-slate-200 truncate w-full px-1" title="${item.file.name}">${item.file.name}</p>
                    <span class="text-[10px] text-slate-400 mt-0.5">${(item.file.size / 1024).toFixed(1)} KB</span>
                `;

                fileGrid.insertBefore(card, addMoreBtn);
            });
        }

        function removeFile(index, event) {
            event.stopPropagation();
            loadedFiles.splice(index, 1);
            renderGrid();
        }

        function resetGrid() {
            loadedFiles = [];
            hideError();
            renderGrid();
        }

        function showError(msg) {
            errorMessage.textContent = msg;
            errorBanner.classList.remove('hidden');
        }

        function hideError() {
            errorBanner.classList.add('hidden');
        }
    </script>
</body>
</html>
