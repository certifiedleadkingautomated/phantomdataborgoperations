<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto / Pause Client Manager</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8 flex flex-col items-center justify-center">

    <div class="w-full max-w-4xl space-y-6">
        
        <!-- Header -->
        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl text-center space-y-2">
            <h1 class="text-2xl md:text-3xl font-bold tracking-tight text-white flex items-center justify-center space-x-3">
                <span>⏸️ Auto / Pause Client Manager</span>
            </h1>
            <p class="text-xs md:text-sm text-slate-400 max-w-xl mx-auto">
                Search clients from Document A, select individual or prefixed groups, and schedule pause or resume operations.
            </p>
        </div>

        <!-- Main Input Form Card -->
        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl space-y-6">
            
            <!-- Auth Token Field -->
            <div class="space-y-1.5">
                <label for="tokenInput" class="text-xs font-semibold text-slate-300 uppercase tracking-wider block">
                    Authorization Token <span class="text-red-400">*</span>
                </label>
                <input type="password" id="tokenInput" placeholder="Enter authorization token..."
                       oninput="validateForm()"
                       class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-xs text-indigo-300 font-mono focus:outline-none focus:border-indigo-500 transition-all">
            </div>

            <!-- Intelligent Live Search Input with Dropdown -->
            <div class="space-y-1.5 relative">
                <label for="clientSearchInput" class="text-xs font-semibold text-slate-300 uppercase tracking-wider block">
                    Search Client Name <span class="text-red-400">*</span>
                </label>
                <div class="relative">
                    <input type="text" id="clientSearchInput" placeholder="Type client name (e.g. Justin Dickmann)..." autocomplete="off"
                           oninput="handleSearchInput()"
                           class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-xs text-slate-100 focus:outline-none focus:border-indigo-500 transition-all">
                    
                    <span id="searchSpinner" class="hidden absolute right-3 top-3 w-4 h-4 border-2 border-indigo-400 border-t-transparent rounded-full animate-spin"></span>
                </div>

                <!-- Live Search Suggestions Dropdown -->
                <div id="suggestionsDropdown" class="hidden absolute left-0 right-0 top-full mt-1 bg-slate-800 border border-slate-700 rounded-xl shadow-2xl z-50 max-h-60 overflow-y-auto divide-y divide-slate-700/50">
                    <!-- Dynamic Search Results -->
                </div>
            </div>

            <!-- Selected Client(s) Display Pills -->
            <div class="space-y-2 bg-slate-900/60 p-4 rounded-xl border border-slate-700/60">
                <div class="flex items-center justify-between">
                    <span class="text-xs font-semibold text-slate-300 uppercase tracking-wider">
                        Selected Client(s) Target
                    </span>
                    <button onclick="clearSelectedClients()" class="text-[11px] text-slate-400 hover:text-red-400 transition-colors font-medium">
                        Clear Selection
                    </button>
                </div>

                <div id="selectedClientsContainer" class="flex flex-wrap gap-2 pt-1 min-h-[36px] items-center">
                    <p id="noSelectionText" class="text-xs text-slate-500 italic">No clients selected. Search above to add.</p>
                </div>
            </div>

            <!-- Action Selector: PAUSE or RESUME -->
            <div class="space-y-2">
                <label class="text-xs font-semibold text-slate-300 uppercase tracking-wider block">
                    Select Operation <span class="text-red-400">*</span>
                </label>
                <div class="grid grid-cols-2 gap-4">
                    <label class="flex items-center justify-center space-x-2 bg-slate-900/60 p-3 rounded-xl border border-slate-700 cursor-pointer hover:border-amber-500/60 transition-all">
                        <input type="radio" name="operationType" value="PAUSE" checked onchange="toggleOperationMode('PAUSE')" class="text-amber-500 focus:ring-0">
                        <span class="text-xs font-bold text-amber-400">⏸️ PAUSE CLIENT(S)</span>
                    </label>
                    <label class="flex items-center justify-center space-x-2 bg-slate-900/60 p-3 rounded-xl border border-slate-700 cursor-pointer hover:border-emerald-500/60 transition-all">
                        <input type="radio" name="operationType" value="RESUME" onchange="toggleOperationMode('RESUME')" class="text-emerald-500 focus:ring-0">
                        <span class="text-xs font-bold text-emerald-400">▶️ RESUME CLIENT(S)</span>
                    </label>
                </div>
            </div>

            <!-- PAUSE Options Panel -->
            <div id="pauseOptionsPanel" class="space-y-4 bg-slate-900/40 p-4 rounded-xl border border-slate-700/60">
                <!-- PAUSE ON Date Picker (Mandatory) -->
                <div class="space-y-2">
                    <div class="flex items-center justify-between">
                        <label for="pauseOnDate" class="text-xs font-semibold text-slate-300 uppercase tracking-wider block">
                            Pause On Date <span class="text-red-400">*</span>
                        </label>
                        <div class="flex space-x-2 text-[10px]">
                            <button type="button" onclick="setPauseDateShortcut('today')" class="px-2 py-1 bg-slate-700 hover:bg-slate-600 text-indigo-300 rounded font-medium transition-colors">Today</button>
                            <button type="button" onclick="setPauseDateShortcut('tomorrow')" class="px-2 py-1 bg-slate-700 hover:bg-slate-600 text-indigo-300 rounded font-medium transition-colors">Tomorrow</button>
                        </div>
                    </div>
                    <input type="date" id="pauseOnDate" required onchange="validateForm()"
                           class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2 text-xs text-amber-300 font-mono focus:outline-none focus:border-amber-500 transition-all">
                </div>

                <!-- RESUME ON Date Picker (Optional) -->
                <div class="space-y-2 pt-2 border-t border-slate-800">
                    <label for="resumeOnDate" class="text-xs font-semibold text-slate-300 uppercase tracking-wider block">
                        Resume On Date <span class="text-slate-500 font-normal">(Optional)</span>
                    </label>
                    <input type="date" id="resumeOnDate"
                           class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2 text-xs text-emerald-300 font-mono focus:outline-none focus:border-emerald-500 transition-all">
                </div>
            </div>

            <!-- Submit Button -->
            <button id="submitActionBtn" onclick="submitAction()" disabled
                class="w-full py-3.5 bg-indigo-600/40 text-slate-400 font-semibold text-xs rounded-xl transition-all shadow-lg flex items-center justify-center space-x-2 cursor-not-allowed">
                <span>🚀 Execute Client Action</span>
            </button>

            <!-- Status Banner -->
            <div id="statusBanner" class="hidden p-3 bg-slate-900 border border-slate-700 rounded-xl text-xs text-center">
                <span id="statusMessage">Processing request...</span>
            </div>

        </div>

    </div>

    <script>
        const tokenInput = document.getElementById('tokenInput');
        const clientSearchInput = document.getElementById('clientSearchInput');
        const searchSpinner = document.getElementById('searchSpinner');
        const suggestionsDropdown = document.getElementById('suggestionsDropdown');
        const selectedClientsContainer = document.getElementById('selectedClientsContainer');
        const noSelectionText = document.getElementById('noSelectionText');
        const pauseOptionsPanel = document.getElementById('pauseOptionsPanel');
        const pauseOnDate = document.getElementById('pauseOnDate');
        const resumeOnDate = document.getElementById('resumeOnDate');
        const submitActionBtn = document.getElementById('submitActionBtn');
        const statusBanner = document.getElementById('statusBanner');
        const statusMessage = document.getElementById('statusMessage');

        let selectedClientsList = [];
        let searchDebounceTimer = null;

        // Replace with your Cloudflare Worker URL
        const WORKER_URL = "https://holy-pond-a4eb.miguel-f88.workers.dev/";

        window.addEventListener('DOMContentLoaded', () => {
            setPauseDateShortcut('today');
        });

        function setPauseDateShortcut(mode) {
            const date = new Date();
            if (mode === 'tomorrow') {
                date.setDate(date.getDate() + 1);
            }
            const yyyy = date.getFullYear();
            const mm = String(date.getMonth() + 1).padStart(2, '0');
            const dd = String(date.getDate()).padStart(2, '0');
            pauseOnDate.value = `${yyyy}-${mm}-${dd}`;
            validateForm();
        }

        // Debounced Search Input Handler (300ms Delay)
        function handleSearchInput() {
            clearTimeout(searchDebounceTimer);
            const query = clientSearchInput.value.trim();
            const token = tokenInput.value.trim();

            if (!query || !token) {
                hideDropdown();
                return;
            }

            searchSpinner.classList.remove('hidden');

            searchDebounceTimer = setTimeout(() => {
                fetchClientSuggestions(query, token);
            }, 300);
        }

        async function fetchClientSuggestions(query, token) {
            try {
                const response = await fetch(WORKER_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        actionType: "SEARCH_CLIENTS",
                        authToken: token, // Sent to Cloudflare for validation
                        query: query
                    })
                });

                const data = await response.json();
                searchSpinner.classList.add('hidden');

                if (data.success && Array.isArray(data.suggestions)) {
                    renderSuggestions(data.suggestions, query);
                } else {
                    hideDropdown();
                }

            } catch (err) {
                searchSpinner.classList.add('hidden');
                hideDropdown();
            }
        }

        function renderSuggestions(suggestions, query) {
            suggestionsDropdown.innerHTML = '';

            if (suggestions.length === 0) {
                suggestionsDropdown.innerHTML = `
                    <div class="p-3 text-xs text-slate-500 italic text-center">No matching clients found</div>
                `;
                suggestionsDropdown.classList.remove('hidden');
                return;
            }

            suggestions.forEach(name => {
                const item = document.createElement('div');
                item.className = "p-3 text-xs text-slate-200 hover:bg-slate-700/80 cursor-pointer flex items-center justify-between transition-colors";
                item.innerHTML = `
                    <span>👤 <strong>${name}</strong></span>
                    <span class="text-[10px] text-indigo-300 bg-indigo-500/10 px-2 py-0.5 rounded">Single Client</span>
                `;
                item.onclick = () => {
                    addClientTag(name);
                    hideDropdown();
                    clientSearchInput.value = '';
                };
                suggestionsDropdown.appendChild(item);
            });

            if (suggestions.length > 1) {
                const groupOption = document.createElement('div');
                groupOption.className = "p-3 text-xs font-bold text-amber-300 bg-amber-500/10 hover:bg-amber-500/20 cursor-pointer flex items-center justify-between transition-colors border-t border-slate-700";
                groupOption.innerHTML = `
                    <span>👥 Select ALL ${suggestions.length} clients matching "${query}"</span>
                    <span class="text-[10px] bg-amber-500/20 text-amber-300 px-2 py-0.5 rounded border border-amber-500/30">Prefix Group</span>
                `;
                groupOption.onclick = () => {
                    suggestions.forEach(name => addClientTag(name));
                    hideDropdown();
                    clientSearchInput.value = '';
                };
                suggestionsDropdown.insertBefore(groupOption, suggestionsDropdown.firstChild);
            }

            suggestionsDropdown.classList.remove('hidden');
        }

        function hideDropdown() {
            suggestionsDropdown.classList.add('hidden');
            suggestionsDropdown.innerHTML = '';
        }

        function addClientTag(name) {
            if (!selectedClientsList.includes(name)) {
                selectedClientsList.push(name);
                renderClientTags();
            }
        }

        function removeClientTag(idx) {
            selectedClientsList.splice(idx, 1);
            renderClientTags();
        }

        function clearSelectedClients() {
            selectedClientsList = [];
            renderClientTags();
        }

        function renderClientTags() {
            selectedClientsContainer.innerHTML = '';

            if (selectedClientsList.length === 0) {
                selectedClientsContainer.appendChild(noSelectionText);
            } else {
                selectedClientsList.forEach((name, idx) => {
                    const pill = document.createElement('div');
                    pill.className = "inline-flex items-center space-x-1.5 px-3 py-1 bg-indigo-600/30 text-indigo-200 border border-indigo-500/40 rounded-lg text-xs font-medium shadow-sm";
                    pill.innerHTML = `
                        <span>${name}</span>
                        <button onclick="removeClientTag(${idx})" class="text-indigo-400 hover:text-red-400 font-bold ml-1 focus:outline-none">✕</button>
                    `;
                    selectedClientsContainer.appendChild(pill);
                });
            }

            validateForm();
        }

        function toggleOperationMode(mode) {
            if (mode === 'PAUSE') {
                pauseOptionsPanel.classList.remove('hidden');
            } else {
                pauseOptionsPanel.classList.add('hidden');
            }
            validateForm();
        }

        function validateForm() {
            const hasToken = tokenInput.value.trim().length > 0;
            const hasClients = selectedClientsList.length > 0;
            const selectedOp = document.querySelector('input[name="operationType"]:checked').value;
            const hasPauseDate = selectedOp === 'PAUSE' ? pauseOnDate.value.trim().length > 0 : true;

            if (hasToken && hasClients && hasPauseDate) {
                submitActionBtn.disabled = false;
                submitActionBtn.className = "w-full py-3.5 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-xs rounded-xl transition-all shadow-lg flex items-center justify-center space-x-2 cursor-pointer";
            } else {
                submitActionBtn.disabled = true;
                submitActionBtn.className = "w-full py-3.5 bg-indigo-600/40 text-slate-400 font-semibold text-xs rounded-xl transition-all shadow-lg flex items-center justify-center space-x-2 cursor-not-allowed";
            }
        }

        async function submitAction() {
            const token = tokenInput.value.trim();
            const operation = document.querySelector('input[name="operationType"]:checked').value;

            if (!token || selectedClientsList.length === 0) return;

            submitActionBtn.disabled = true;
            statusBanner.classList.remove('hidden');
            statusMessage.textContent = "Submitting action...";
            statusMessage.className = "text-xs text-amber-300 font-mono";

            try {
                const response = await fetch(WORKER_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        actionType: "SUBMIT_CLIENT_ACTION",
                        authToken: token,
                        selectedClients: selectedClientsList,
                        operation: operation,
                        pauseOnDate: operation === 'PAUSE' ? pauseOnDate.value : '',
                        resumeOnDate: operation === 'PAUSE' ? resumeOnDate.value : ''
                    })
                });

                const data = await response.json();

                if (data.success) {
                    statusMessage.textContent = `✓ ${data.message || "Action processed"}`;
                    statusMessage.className = "text-xs text-emerald-400 font-mono font-bold";
                    clearSelectedClients();
                } else {
                    statusMessage.textContent = `✕ No action logged.`;
                    statusMessage.className = "text-xs text-slate-400 font-mono";
                }

            } catch (err) {
                statusMessage.textContent = `✕ Connection error.`;
                statusMessage.className = "text-xs text-slate-400 font-mono";
            } finally {
                submitActionBtn.disabled = false;
            }
        }

        document.addEventListener('click', (e) => {
            if (!clientSearchInput.contains(e.target) && !suggestionsDropdown.contains(e.target)) {
                hideDropdown();
            }
        });
    </script>
</body>
</html>
